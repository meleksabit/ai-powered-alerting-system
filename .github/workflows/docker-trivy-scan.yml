name: Docker Vulnerability Scan

on:
  workflow_run:
    workflows: ["Docker Build and Push to DockerHub"]
    types:
      - completed

jobs:
  scan:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      ######################################################################
      # 1. EXPAND DISK SPACE
      ######################################################################
      - name: Expand available disk space for Trivy + Docker
        run: |
          echo "Allocating additional disk..."
          sudo fallocate -l 15G /mnt/extra.img
          sudo mkfs.ext4 /mnt/extra.img
          sudo mkdir -p /mnt/extra
          sudo mount -o loop /mnt/extra.img /mnt/extra
          sudo chown -R $USER:$USER /mnt/extra

          echo "Setting up directories..."
          mkdir -p /mnt/extra/tmp
          mkdir -p /mnt/extra/trivy-cache

          echo "TMPDIR=/mnt/extra/tmp" >> $GITHUB_ENV
          echo "TRIVY_CACHE_DIR=/mnt/extra/trivy-cache" >> $GITHUB_ENV

      ######################################################################
      # 2. DOWNLOAD IMAGE TAG ARTIFACT
      ######################################################################
      - name: Download TAG artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          name: tag
          path: .
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_search: true
          repo: meleksabit/ai-powered-alerting-system
          workflow_conclusion: success

      - name: Load TAG
        run: |
          TAG=$(cat tag.txt)
          echo "TAG=$TAG" >> $GITHUB_ENV

      ######################################################################
      # 3. INSTALL TRIVY
      ######################################################################
      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.deb
          sudo dpkg -i trivy_0.69.3_Linux-64bit.deb
          trivy --version

      ######################################################################
      # 4. DOCKER LOGIN
      ######################################################################
      - name: Log in to DockerHub
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      ######################################################################
      # 5. IMAGE SCANNING FUNCTION (REUSABLE)
      ######################################################################
      - name: Scan Images (App, Prometheus, Grafana)
        run: |
          scan() {
            local IMAGE="$1"
            echo "=== Pulling $IMAGE ==="
            docker pull "$IMAGE"

            echo "=== Scanning $IMAGE ==="
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --cache-dir "$TRIVY_CACHE_DIR" \
              "$IMAGE"

            echo "Cleaning temporary data..."
            docker system prune -af || true
            rm -rf "$TMPDIR"/* || true
          }

          scan "${{ secrets.DOCKER_USERNAME }}/ai-powered-alerting-system:${{ env.TAG }}"
          scan "${{ secrets.DOCKER_USERNAME }}/prometheus:${{ env.TAG }}"
          scan "${{ secrets.DOCKER_USERNAME }}/grafana:${{ env.TAG }}"
